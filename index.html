<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEFF3">
<meta name="description" content="Orbit. A private dashboard for your days.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Orbit">
<title>Orbit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --surface-2:#F5F6F9; --line:#DFE2EA;
  --ink:#1E2238; --ink-2:#565B74; --ink-3:#8A8FA6;
  --accent:#3D418F; --accent-soft:#E5E6F4; --on-accent:#FFFFFF;
  --fajr:#9497CE; --dhuhr:#E0B444; --asr:#D9884A; --maghrib:#C65C77; --isha:#3D418F;
  --good:#2E7C62; --warn:#B98118; --bad:#BF506A;
  --shadow:0 1px 2px rgba(30,34,56,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11131D; --surface:#191C29; --surface-2:#202434; --line:#2A2E41;
    --ink:#E8E9F2; --ink-2:#A6AAC2; --ink-3:#71768F;
    --accent:#9296E8; --accent-soft:#272A4C; --on-accent:#11131D;
    --isha:#6D72D6; --good:#5CB595; --warn:#D9A441; --bad:#E07D93; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#11131D; --surface:#191C29; --surface-2:#202434; --line:#2A2E41;
  --ink:#E8E9F2; --ink-2:#A6AAC2; --ink-3:#71768F;
  --accent:#9296E8; --accent-soft:#272A4C; --on-accent:#11131D;
  --isha:#6D72D6; --good:#5CB595; --warn:#D9A441; --bad:#E07D93; --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{font-family:'Poppins','Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num,.amt,.v,.val{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding:14px 18px calc(104px + env(safe-area-inset-bottom,0px))}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:10px 0 18px}
.ph h1{font-size:27px;font-weight:600;letter-spacing:-.028em;line-height:1.15}
.ph p{color:var(--ink-3);font-size:13.5px;margin-top:3px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--ink-2);font-size:14px;font-weight:500;padding:6px 8px 6px 0;margin-top:4px}
.back svg{width:18px;height:18px}
.sec{margin-top:28px}
.sec.tight{margin-top:18px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 10px}
.sec-h h2{font-size:16px;font-weight:600;letter-spacing:-.012em}
.aside{font-size:13px;color:var(--ink-3)}
.link{color:var(--accent);font-size:13.5px;font-weight:500;padding:4px 0}
.link.danger{color:var(--bad)}
.muted{color:var(--ink-3)} .small{font-size:13px}
.empty{color:var(--ink-3);font-size:14px;padding:22px 4px;text-align:center}
.foot{color:var(--ink-3);font-size:12.5px;text-align:center;margin-top:26px;line-height:1.6}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);min-height:54px;width:100%}
.list>.row:first-child,.list>:first-child{border-top:0}
.row .grow,.grow{flex:1;min-width:0}
.row .t{display:block;font-size:14.5px;font-weight:500;overflow-wrap:anywhere}
.row .s{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.row .chev{width:18px;height:18px;color:var(--ink-3);flex:none}
.row.more-link{color:var(--accent);font-size:13.5px;font-weight:500;min-height:44px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--accent)}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.good{background:var(--good)} .dot.soft{background:var(--ink-3)}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px;margin-bottom:18px}
.seg button{flex:1;padding:8px 4px;border-radius:11px;font-size:13.5px;font-weight:500;color:var(--ink-2);text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(30,34,56,.1)}

.field{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;outline:none;min-width:0;appearance:none;-webkit-appearance:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field::placeholder{color:var(--ink-3)}
.field.bare{background:transparent;border:0;padding:6px 0;box-shadow:none}
textarea.field{min-height:84px;resize:vertical;line-height:1.65}
textarea.field.tall{min-height:220px}
input[type=date].field,input[type=time].field{min-height:46px}
.addbar{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:12px;font-weight:500;font-size:14.5px;background:var(--accent);color:var(--on-accent);white-space:nowrap;min-height:44px;text-align:center}
.btn svg{width:17px;height:17px}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:10px}
.ibtn{width:38px;height:38px;border-radius:11px;display:inline-grid;place-items:center;color:var(--ink-3);flex:none}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.ibtn svg{width:19px;height:19px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{margin-top:4px}
.form{display:grid;gap:14px}
.lbl{font-size:12.5px;color:var(--ink-2);margin-bottom:6px;display:block;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips label{position:relative;cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;padding:7px 13px;border-radius:99px;border:1px solid var(--line);font-size:13px;background:var(--surface-2);color:var(--ink-2)}
.chips input:checked+span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chips input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* checkbox */
.ck{width:23px;height:23px;border-radius:8px;border:1.7px solid var(--ink-3);display:grid;place-items:center;flex:none;color:var(--on-accent)}
.ck svg{width:15px;height:15px;stroke-width:2.6}
.ck.on{background:var(--accent);border-color:var(--accent)}
.task.done .grow{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.task .when{font-size:12px;color:var(--bad);display:block}
.row form,.row.addrow{gap:8px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:5px 8px calc(5px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:11px;color:var(--ink-3);font-weight:500;border-radius:12px}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* hero: the day as a ribbon */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px 18px 16px;box-shadow:var(--shadow)}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .lead{font-size:12.5px;color:var(--ink-3)}
.hero .wname{font-size:38px;font-weight:600;letter-spacing:-.035em;line-height:1.05;margin-top:2px}
.hero .wmeta{font-size:14px;color:var(--ink-2);margin-top:6px}
.hero .count{font-size:13px;color:var(--ink-2);text-align:right;white-space:nowrap;padding-top:2px}
.hero .count b{font-size:20px;font-weight:600;color:var(--ink);display:block;letter-spacing:-.02em}
.ribbon{position:relative;margin:20px 0 4px;height:26px}
.ribbon .track{position:absolute;left:0;right:0;top:9px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.ribbon .track i{position:absolute;top:0;bottom:0}
.ribbon .nowm{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px}
.ribbon .nowm::after{content:"";position:absolute;left:50%;top:-3px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink)}
.ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-bottom:12px}
.wq{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wq button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 9px;border-radius:15px;background:var(--surface-2);border:1.5px solid transparent;text-align:center}
.wq button.cur{border-color:var(--wc);background:color-mix(in srgb,var(--wc) 11%,var(--surface))}
.wq .nm{font-size:12px;font-weight:500;line-height:1.2}
.wq .tm{font-size:10.5px;color:var(--ink-3);line-height:1.2}
.mark{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--wc);display:grid;place-items:center;color:#fff;flex:none}
.mark svg{width:14px;height:14px;stroke-width:2.8}
.mark.on{background:var(--wc)}
.mark.qaza{background:linear-gradient(90deg,var(--wc) 50%,transparent 50%)}
.mark.miss{border-color:var(--bad);color:var(--bad)}
.legend{display:flex;gap:14px;justify-content:center;font-size:11.5px;color:var(--ink-3);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink-3)}
.legend i.on{background:var(--ink-3)} .legend i.qaza{background:linear-gradient(90deg,var(--ink-3) 50%,transparent 50%)} .legend i.miss{border-color:var(--bad)}

/* pulse */
.pulse{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.pulse>*{padding:14px 16px;border:solid var(--line);border-width:0;min-height:92px;display:flex;flex-direction:column;align-items:flex-start;width:100%}
.pulse>:nth-child(odd){border-right-width:1px}
.pulse>:nth-child(n+3){border-top-width:1px}
.pulse .k{font-size:12.5px;color:var(--ink-3)}
.pulse .v{font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:1px}
.pulse .v small{font-size:13px;color:var(--ink-3);font-weight:500;letter-spacing:0}
.pulse .s{font-size:12px;color:var(--ink-3);margin-top:auto}
.pulse .mini{margin-top:auto;font-size:12.5px;font-weight:500;color:var(--accent);padding:2px 0}
.bar{height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:auto;width:100%}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:9px}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.quote{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--fajr);border-radius:6px 16px 16px 6px;padding:12px 14px;margin-bottom:8px;font-size:14.5px;line-height:1.6}

/* day */
.dnav{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 14px}
.dlbl{font-weight:600;font-size:15px;padding:6px 12px;border-radius:10px}
.timeline{list-style:none;margin-top:16px;position:relative}
.timeline li{display:flex;gap:14px;align-items:flex-start;padding:10px 0 10px;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.timeline time{width:66px;flex:none;font-size:13px;color:var(--ink-3);padding-top:8px;font-variant-numeric:tabular-nums}
.timeline .grow{padding-top:7px;font-size:14.5px;overflow-wrap:anywhere}
.field.time{width:112px;flex:none}
.salrow{flex-wrap:wrap;row-gap:8px}
.wdot{width:10px;height:10px;border-radius:50%;background:var(--wc);flex:none}
.tri{display:flex;gap:4px;margin-left:auto}
.tri button{font-size:12px;padding:6px 9px;border-radius:9px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2)}
.tri button.on[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.tri button.qaza[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.tri button.miss[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.stats>div{padding:12px 14px;border-left:1px solid var(--line)}
.stats>div:first-child{border-left:0}
.stats .k{font-size:12px;color:var(--ink-3)}
.stats .v{font-size:18px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.mx{display:grid;grid-template-columns:58px repeat(14,1fr);gap:4px;align-items:center}
.mx .c{aspect-ratio:1;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.mx .c.on{background:var(--wc);border-color:transparent}
.mx .c.qaza{background:color-mix(in srgb,var(--wc) 40%,var(--surface-2));border-color:transparent}
.mx .c.miss{background:transparent;border:1.5px solid var(--bad)}
.mx .l{font-size:11.5px;color:var(--ink-2)}
.mx .h{font-size:10px;color:var(--ink-3);text-align:center}
.vcard{padding:16px}
.vh{display:flex;justify-content:space-between;align-items:baseline}
.vh .t{font-weight:600;font-size:15px}
.vh .s{font-size:12.5px;color:var(--ink-3)}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.stepper .val{font-size:28px;font-weight:600;letter-spacing:-.03em}
.stepper .val small{font-size:14px;color:var(--ink-3);font-weight:500;margin-left:2px}
.stepper .ibtn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:46px;height:46px;border-radius:14px;font-size:22px}
.cups{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.cups button{width:30px;height:38px;border-radius:5px 5px 11px 11px;border:1.7px solid var(--accent);opacity:.9}
.cups button.on{background:var(--accent)}
.cups .addc{border-style:dashed;display:grid;place-items:center;color:var(--accent)}
.cups .addc svg{width:14px;height:14px}
.vgroup>.vcard{border-top:1px solid var(--line)}
.vgroup>.vcard:first-child{border-top:0}
.chart{display:flex;align-items:flex-end;gap:7px;height:86px;position:relative;margin-top:12px}
.chart .b{flex:1;height:100%;display:flex;align-items:flex-end}
.chart .b i{width:100%;border-radius:6px 6px 3px 3px;background:color-mix(in srgb,var(--accent) 55%,var(--surface-2));min-height:3px}
.chart .b.last i{background:var(--accent)}
.chart .b.none i{background:transparent;border:1px dashed var(--line);height:6px!important}
.chart .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink-3);opacity:.55;pointer-events:none}
.days{display:flex;gap:7px;margin-top:6px}
.days span{flex:1;text-align:center;font-size:11px;color:var(--ink-3)}
.trend{font-size:13px;color:var(--ink-2);margin-top:10px}

/* study */
.sov .line{font-size:17px;font-weight:600;letter-spacing:-.015em}
.sov .sub{font-size:13px;color:var(--ink-3);margin-top:2px}
.sov .bar{height:8px;margin:14px 0 12px}
.sov .pace{font-size:13.5px;color:var(--ink-2);line-height:1.6}
.examrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.examrow .field{width:auto;padding:7px 10px;min-height:0;font-size:13.5px}
.timer{display:flex;align-items:center;gap:12px}
.timer .t{font-weight:600;font-size:15px}
.timer .s{font-size:12.5px;color:var(--ink-3)}
.timer.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.timer.on .s{color:inherit;opacity:.75}
.timer.on .btn{background:var(--on-accent);color:var(--accent)}
.clock{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-left:auto}
.wk{margin-top:12px;display:grid;gap:9px}
.wk .r{display:grid;grid-template-columns:92px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.wk .bar{margin:0;height:6px}
.wk .r span:last-child{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grp .gh .t{margin-bottom:7px}
.grp .gh .bar{height:5px}
.grp .pct{font-size:13px;color:var(--ink-2);font-weight:500;width:40px;text-align:right;font-variant-numeric:tabular-nums}
.grp .gh .chev{transition:transform .2s}
.grp.open .gh .chev{transform:rotate(90deg)}
.paper{border-top:1px solid var(--line);background:var(--surface-2)}
.paper .ph2{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.paper .ph2 .t{font-weight:600;font-size:13.5px;flex:1}
.ch{padding:10px 16px 12px}
.ch+.ch{border-top:1px dashed var(--line)}
.ch .nm{font-size:14px;display:flex;gap:10px;align-items:baseline}
.ch .nm .n{font-size:11.5px;color:var(--ink-3);width:18px;flex:none;font-variant-numeric:tabular-nums}
.ch.full .nm{color:var(--ink-2)}
.ch.full .nm .n{color:var(--good);font-weight:600}
.steps{display:flex;gap:6px;margin:8px 0 0 28px;flex-wrap:wrap}
.steps button{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.steps button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ch.edit,.ch.add{display:flex;gap:8px;align-items:center}
.ch.edit .field,.ch.add .field{padding:8px 11px;font-size:14px;background:var(--surface)}
.paper .link.danger{display:block;padding:4px 16px 14px}

/* wallet */
.sum3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.sum3.two-col{grid-template-columns:1fr 1fr}
.sum3>div{padding:13px 14px;border-left:1px solid var(--line)}
.sum3>div:first-child{border-left:0}
.sum3 .k{font-size:12px;color:var(--ink-3)}
.sum3 .v{font-size:17px;font-weight:600;letter-spacing:-.02em;margin-top:1px;overflow-wrap:anywhere}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}
.dayhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin:18px 4px 7px;font-weight:500}
.amt{font-weight:600;font-size:14.5px;white-space:nowrap}
.amt.pos{color:var(--good)}
.status{font-size:13.5px;font-weight:500;margin-top:10px}
.status.bad{color:var(--bad)} .status.warn{color:var(--warn)} .status.good{color:var(--good)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.kv>div{background:var(--surface-2);padding:11px 13px}
.kv span{display:block;font-size:12px;color:var(--ink-3)}
.kv b{font-weight:600;font-size:15px}
.subh{font-size:13px;font-weight:600;margin:16px 2px 8px}
details.closed{margin-top:16px}
details.closed summary{cursor:pointer;font-size:13.5px;color:var(--ink-2);font-weight:500;padding:6px 2px;list-style:none}
details.closed summary::-webkit-details-marker{display:none}
details.closed .list{margin-top:8px;opacity:.8}
.cat{padding:12px 16px;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat .top{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.cat .top span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.cat .bar{margin-top:8px;height:6px}
.cat .lim{font-size:12px;color:var(--ink-3);margin-top:5px}
.insights{display:grid;gap:10px}
.insights p{font-size:14px;line-height:1.55;padding-left:14px;border-left:2px solid var(--line)}
.insights p.warn{border-color:var(--warn)} .insights p.bad{border-color:var(--bad)} .insights p.good{border-color:var(--good)}
label.lim{display:grid;grid-template-columns:1fr 130px;align-items:center;gap:10px;font-size:14px}

/* more */
.menu .mi{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.menu .mi svg{width:19px;height:19px}
.mh{font-size:13px;color:var(--ink-3);font-weight:500;margin:22px 2px 8px}
.mo{display:flex;gap:12px;align-items:flex-start;padding:12px 14px 12px 16px;border-top:1px solid var(--line)}
.mo:first-child{border-top:0}
.mo time{font-size:12px;color:var(--ink-3);width:54px;flex:none;padding-top:3px}
.mo p{flex:1;font-size:14.5px;line-height:1.6;overflow-wrap:anywhere}
.mo .ibtn{width:30px;height:30px;margin:-3px -6px 0 0}
.story .ex{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.55}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500;white-space:nowrap}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.tag.soft{background:var(--surface-2);color:var(--ink-3)}
.tag.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.rcol{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.prose{white-space:pre-wrap;font-size:15.5px;line-height:1.8;overflow-wrap:anywhere;margin:14px 0 20px}
.meta{font-size:13px;color:var(--ink-3)}
.steplist{list-style:none;counter-reset:s;display:grid;gap:12px;margin-top:4px}
.steplist li{counter-increment:s;display:flex;gap:12px;font-size:14px;line-height:1.55}
.steplist li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;display:grid;place-items:center;flex:none}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}
.check .s{display:block;font-size:12.5px;color:var(--ink-3)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(14,16,28,.45);z-index:40;opacity:0;transition:opacity .22s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sh-h h3{font-size:19px;font-weight:600;letter-spacing:-.02em;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:370px){.app{padding-left:14px;padding-right:14px}.hero .wname{font-size:32px}.wq .nm{font-size:11px}.tri button{padding:6px 7px}}
</style>

<body>
<main id="main" class="app" aria-live="off"></main>
<nav id="nav" class="tabs" aria-label="Sections"></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ================= constants ================= */
const APP='Orbit', VERSION='1.0';
const WAQT=[['fajr','Fajr'],['dhuhr','Dhuhr'],['asr','Asr'],['maghrib','Maghrib'],['isha','Isha']];
const WN=Object.fromEntries(WAQT);
const SALST={on:'On time',qaza:'Qaza',miss:'Missed'};
const STEPS=[['read','Read'],['mcq','MCQ'],['cq','CQ'],['rev','Revise']];
const EXP_CATS=['Food','Transport','Study','Books','Mobile & net','Outing','Health','Gifts','Other'];
const INC_CATS=['Allowance','Tuition','Gift','Other'];

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const daysBetween=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const money=n=>(n<0?'−':'')+'৳'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const fmtDate=(s,o={day:'numeric',month:'short'})=>parseYmd(s).toLocaleDateString('en-GB',o);
const fmtLong=s=>fmtDate(s,{day:'numeric',month:'short',year:'numeric'});
const monthLabel=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})};
const monthShort=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-GB',{month:'long'})};
const daysInMonth=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const shiftMonth=(m,n)=>{const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const nowH=()=>{const d=new Date();return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600};
function fmtT(h){h=((h%24)+24)%24;let H=Math.floor(h),M=Math.round((h-H)*60);if(M===60){H=(H+1)%24;M=0}return `${H%12||12}:${pad(M)} ${H<12?'am':'pm'}`}
const fmtHM=s=>{const[h,m]=s.split(':').map(Number);return fmtT(h+m/60)};
function dur(h){const m=Math.max(0,Math.round(h*60)),H=Math.floor(m/60),M=m%60;return H?(M?`${H}h ${M}m`:`${H}h`):`${M}m`}
const fmtMin=m=>dur(m/60);
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;

const I={
 home:'<path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4.2v-5.8H9.2v5.8H5A1.5 1.5 0 0 1 3.5 19z"/>',
 day:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>',
 study:'<path d="M4 19.5V5.5A2.5 2.5 0 0 1 6.5 3H20v14H6.5A2.5 2.5 0 0 0 4 19.5a2.5 2.5 0 0 0 2.5 2.5H20v-5"/>',
 wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10.5h18M7 6V5a2 2 0 0 1 2-2h8"/><circle cx="16.5" cy="15" r=".6"/>',
 more:'<rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',x:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
 left:'<path d="m14.5 6-6 6 6 6"/>',right:'<path d="m9.5 6 6 6-6 6"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"/>',
 gear:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>',
 fwd:'<path d="M5 12h13M13 7l5 5-5 5"/>',undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',play:'<path d="M7 5v14l11-7z"/>',stop:'<rect x="6.5" y="6.5" width="11" height="11" rx="2"/>',
 moment:'<path d="M12 3c.6 4.3 2.7 6.4 7 7-4.3.6-6.4 2.7-7 7-.6-4.3-2.7-6.4-7-7 4.3-.6 6.4-2.7 7-7z"/>',
 story:'<path d="M5.5 3.5h9l4 4v13h-13z"/><path d="M14.5 3.5v4h4M8.5 12h7M8.5 16h5"/>',
 box:'<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>',
 bell:'<path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
 download:'<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>',upload:'<path d="M12 16V5M7 9.5l5-5 5 5M5 20h14"/>',
 pin:'<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>'
};
const ic=(n,c='')=>`<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ================= prayer times (offline, Karachi method) ================= */
const PT=(()=>{
 const dtr=d=>d*Math.PI/180,rtd=r=>r*180/Math.PI;
 const sin=d=>Math.sin(dtr(d)),cos=d=>Math.cos(dtr(d)),tan=d=>Math.tan(dtr(d));
 const asin=x=>rtd(Math.asin(x)),acos=x=>rtd(Math.acos(clamp(x,-1,1))),atan2=(y,x)=>rtd(Math.atan2(y,x)),acot=x=>rtd(Math.atan(1/x));
 const fixA=a=>a-360*Math.floor(a/360),fixH=a=>a-24*Math.floor(a/24);
 const julian=(y,m,d)=>{if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5};
 const sunPos=jd=>{const D=jd-2451545,g=fixA(357.529+.98560028*D),q=fixA(280.459+.98564736*D),L=fixA(q+1.915*sin(g)+.02*sin(2*g)),e=23.439-.00000036*D,RA=atan2(cos(e)*sin(L),cos(L))/15;return{decl:asin(sin(e)*sin(L)),eqt:q/15-fixH(RA)}};
 return (date,lat,lng,hanafi)=>{
  const jd=julian(date.getFullYear(),date.getMonth()+1,date.getDate())-lng/(15*24);
  const mid=t=>fixH(12-sunPos(jd+t).eqt);
  const ang=(a,t,ccw)=>{const dc=sunPos(jd+t).decl,T=acos((-sin(a)-sin(dc)*sin(lat))/(cos(dc)*cos(lat)))/15;return mid(t)+(ccw?-T:T)};
  const asrT=(f,t)=>{const dc=sunPos(jd+t).decl;return ang(-acot(f+tan(Math.abs(lat-dc))),t)};
  const tz=-date.getTimezoneOffset()/60,adj=h=>h+tz-lng/15;
  return {fajr:adj(ang(18,5/24,true)),sunrise:adj(ang(.833,6/24,true)),dhuhr:adj(mid(.5))+1/60,asr:adj(asrT(hanafi?2:1,13/24)),maghrib:adj(ang(.833,18/24))+1/60,isha:adj(ang(18,18/24))};
 };
})();
const PTC=new Map();
function pt(d){const s=S.settings,k=`${d}|${s.lat}|${s.lng}|${s.asr}`;if(!PTC.has(k))PTC.set(k,PT(parseYmd(d),s.lat,s.lng,s.asr==='hanafi'));return PTC.get(k)}
function waqtEnds(d){const p=pt(d);return{fajr:p.sunrise,dhuhr:p.asr,asr:p.maghrib,maghrib:p.isha,isha:24+pt(addDays(d,1)).fajr}}
function waqtNow(){
 const t=today(),p=pt(t),h=nowH();
 if(h<p.fajr)return{k:'isha',date:addDays(t,-1),end:p.fajr};
 if(h<p.sunrise)return{k:'fajr',date:t,end:p.sunrise};
 if(h<p.dhuhr)return{k:null,next:'dhuhr',at:p.dhuhr};
 if(h<p.asr)return{k:'dhuhr',date:t,end:p.asr};
 if(h<p.maghrib)return{k:'asr',date:t,end:p.maghrib};
 if(h<p.isha)return{k:'maghrib',date:t,end:p.isha};
 return{k:'isha',date:t,end:24+pt(addDays(t,1)).fajr};
}
const salGet=(d,k)=>(S.salah[d]||{})[k]||'';
function salSet(d,k,v){const o=S.salah[d]||(S.salah[d]={});if(v)o[k]=v;else delete o[k];if(!Object.keys(o).length)delete S.salah[d]}
const markIcon=st=>st==='on'?ic('check'):st==='miss'?ic('x'):'';

/* ================= storage ================= */
const DB={
 db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('orbit',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
 get(k){return new Promise(res=>{if(!this.db){try{res(JSON.parse(localStorage.getItem('orbit:'+k)))}catch(e){res(null)}return}try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})},
 set(k,v){return new Promise(res=>{if(!this.db){try{localStorage.setItem('orbit:'+k,JSON.stringify(v))}catch(e){}return res()}try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(JSON.parse(JSON.stringify(v)),k);tx.oncomplete=res;tx.onerror=res}catch(e){res()}})}
};
let S,saveT;
function save(){if(S)S._t=Date.now();clearTimeout(saveT);saveT=setTimeout(()=>DB.set('state',S),200);window.orbitSync?.notify?.()}
function commit(){save();render()}

 return [
  P('Physics','1st paper',['Physical world and measurement','Vector','Dynamics','Newtonian mechanics','Work, energy and power','Gravitation and gravity','Structural properties of matter','Periodic motion','Waves','Ideal gas and kinetic theory']),

function freshState(){return{
 v:1,created:today(),
 settings:{name:'',place:'Dhaka',lat:23.8103,lng:90.4125,asr:'hanafi',examDate:'',water:8,sleep:8,screen:4,theme:'auto',lastBackup:''},

function migrate(o){const f=freshState();for(const k in f)if(o[k]===undefined)o[k]=f[k];o.settings={...f.settings,...o.settings};return o}

/* ================= ui state ================= */
const U={tab:'home',daySeg:'plan',walletSeg:'spend',vaultSeg:'gadget',more:null,date:today(),month:today().slice(0,7),open:{},edit:null,q:''};
const head=(t,tag,right='')=>`<header class="ph"><div><h1>${t}</h1>${tag?`<p>${tag}</p>`:''}</div>${right}</header>`;
const segc=(key,opts)=>`<div class="seg" role="group">${opts.map(([v,n])=>`<button data-a="seg" data-k="${key}" data-v="${v}" aria-pressed="${U[key]===v}">${n}</button>`).join('')}</div>`;
function dayLabel(d){const t=today();return d===t?'Today':d===addDays(t,-1)?'Yesterday':d===addDays(t,1)?'Tomorrow':fmtDate(d,{weekday:'short',day:'numeric',month:'short'})}
const dateNav=()=>`<div class="dnav"><button class="ibtn" data-a="shiftDate" data-n="-1" aria-label="Previous day">${ic('left')}</button><button class="dlbl" data-a="toToday">${dayLabel(U.date)}</button><button class="ibtn" data-a="shiftDate" data-n="1" aria-label="Next day">${ic('right')}</button></div>`;

const bar=(r,cls='')=>`<div class="bar ${cls}"><i style="width:${clamp(r*100,0,100)}%"></i></div>`;

/* ================= render ================= */
const TABS=[['home','Home'],['day','Day'],['study','Study'],['wallet','Wallet'],['more','More']];
function render(){
 const v={home:vHome,day:vDay,study:vStudy,wallet:vWallet,more:vMore}[U.tab];
 $('#main').innerHTML=v();
 $('#nav').innerHTML=`<div class="in">${TABS.map(([k,n])=>`<button data-a="tab" data-v="${k}" ${U.tab===k?'aria-current="page"':''}>${ic(k)}<span>${n}</span></button>`).join('')}</div>`;
}
function refocus(sel){const el=$(sel);if(el)el.focus()}

/* ---------- HOME ---------- */
function vHome(){
 const t=today(),h=new Date().getHours();
 const greet=h<5?'Still up':h<12?'Good morning':h<17?'Good afternoon':'Good evening';
 const name=S.settings.name?`, ${esc(S.settings.name.split(' ')[0])}`:'';
 const tasks=S.tasks.filter(x=>x.date===t),open=tasks.filter(x=>!x.done);
 const carried=S.tasks.filter(x=>!x.done&&x.date<t).length;
 const moms=S.moments.filter(x=>x.date===t);

const rem=l=>Math.max(0,l.amt-sum((l.paid||[]).map(p=>p.amt)));

function reportHtml(){
 const m=U.month,list=monthTx(m),outs=list.filter(x=>x.type==='out'),out=sum(outs.map(x=>x.amt)),inc=sum(list.filter(x=>x.type==='in').map(x=>x.amt));
 const cats={};outs.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.amt);
 const sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
 const pm=shiftMonth(m,-1),prevOut=sum(monthTx(pm).filter(x=>x.type==='out').map(x=>x.amt));
 const cur=m===today().slice(0,7),dim=daysInMonth(m),elapsedD=cur?new Date().getDate():dim;
 const ins=[];
 if(out){
  const avg=out/elapsedD;ins.push({t:`You spend about ${money(avg)} a day.`});
  if(sorted[0])ins.push({t:`${sorted[0][0]} takes ${Math.round(sorted[0][1]/out*100)}% of your spending.`});
  const proj=cur?avg*dim:out;
  if(cur&&elapsedD<dim)ins.push({t:`At this pace, ${monthShort(m)} ends at ${money(proj)}.`});
  if(prevOut){const ch=Math.round((proj-prevOut)/prevOut*100);if(Math.abs(ch)>=5)ins.push({c:ch>0?'warn':'good',t:`That is ${Math.abs(ch)}% ${ch>0?'more':'less'} than ${monthShort(pm)} (${money(prevOut)}).`})}
  Object.entries(S.budgets).forEach(([c,lim])=>{const s=cats[c]||0;if(s>lim)ins.push({c:'bad',t:`${c} is over its limit by ${money(s-lim)}.`});else if(s>=lim*.8)ins.push({c:'warn',t:`${c} has used ${Math.round(s/lim*100)}% of its limit.`})});
  if(inc){if(out>inc)ins.push({c:'bad',t:`You spent ${money(out-inc)} more than came in.`});else ins.push({c:'good',t:`You kept ${Math.round((inc-out)/inc*100)}% of what came in.`})}
 }
 const max=sorted.length?sorted[0][1]:1;
 return monthNav()+`<div class="sum3"><div><div class="k">In</div><div class="v">${money(inc)}</div></div><div><div class="k">Out</div><div class="v">${money(out)}</div></div><div><div class="k">Net</div><div class="v">${money(inc-out)}</div></div></div>
 ${out?`<section class="sec"><div class="sec-h"><h2>What stands out</h2></div><div class="insights">${ins.map(i=>`<p class="${i.c||''}">${i.t}</p>`).join('')}</div></section>`:`<p class="empty">No expenses in ${monthShort(m)} yet.</p>`}
 <section class="sec"><div class="sec-h"><h2>By category</h2><button class="link" data-a="budgetEdit">Set limits</button></div>
 ${sorted.length?`<div class="list">${sorted.map(([c,v])=>{const lim=S.budgets[c];const r=lim?v/lim:v/max;return `<div class="cat"><div class="top"><span>${esc(c)}</span><span>${money(v)}</span></div>${bar(r,lim?(r>1?'bad':r>=.8?'warn':''):'')}${lim?`<div class="lim">${Math.round(v/lim*100)}% of ${money(lim)} limit</div>`:''}</div>`}).join('')}</div>`:`<p class="empty">Categories show up once you add expenses.</p>`}</section>`;
}

/* ================= calendar export ================= */
function buildIcs(o){
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Orbit//Life//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Orbit'];
 const utc=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
 const dv=s=>s.replace(/-/g,''),stamp=utc(new Date()),at=(d,h)=>new Date(parseYmd(d).getTime()+h*3600000);
 const tx=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
 const ev=(id,start,end,title,alarms,allDay)=>{L.push('BEGIN:VEVENT',`UID:${id}@orbit.app`,`DTSTAMP:${stamp}`,allDay?`DTSTART;VALUE=DATE:${start}`:`DTSTART:${start}`,allDay?`DTEND;VALUE=DATE:${end}`:`DTEND:${end}`,`SUMMARY:${tx(title)}`);alarms.forEach(a=>L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${tx(title)}`,`TRIGGER${a}`,'END:VALARM'));L.push('END:VEVENT')};
 const t=today();
 if(o.prayers)for(let i=0;i<30;i++){const d=addDays(t,i),p=pt(d),e=waqtEnds(d);WAQT.forEach(([k,n])=>{const end=k==='isha'?24:e[k];ev(`${d}-${k}`,utc(at(d,p[k])),utc(at(d,end)),`${n}`,k==='isha'?[':PT0M']:[':PT0M',';RELATED=END:-PT20M'])})}
 if(o.loans)S.loans.filter(l=>!l.closed&&l.due&&l.due>=t).forEach(l=>ev(`loan-${l.id}`,dv(l.due),dv(addDays(l.due,1)),l.dir==='lent'?`Ask ${l.person} for Tk ${Math.round(rem(l))}`:`Repay ${l.person} Tk ${Math.round(rem(l))}`,[':-PT15H',':PT9H'],true));
 if(o.warranty)S.assets.filter(a=>a.kind==='gadget'&&a.warranty&&a.warranty>=t).forEach(a=>ev(`warranty-${a.id}`,dv(a.warranty),dv(addDays(a.warranty,1)),`${a.name} warranty ends`,[':-P7D'],true));
 L.push('END:VCALENDAR');return L.join('\r\n');
}
function download(name,text,type){const b=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

}

function syncHtml(){
 const y=window.orbitSync?.state;
 if(!y||!y.configured)return `<p class="small" style="color:var(--ink-2);line-height:1.6">Cloud sync is not set up yet. Until it is, your data stays on this device only.</p>`;
 const err=y.error?`<p class="small" style="color:var(--bad,#c0392b);line-height:1.6">${esc(y.error)}</p>`:'';
 if(!y.user)return `<p class="small" style="color:var(--ink-2);line-height:1.6">Sign in with the same Google account on your phone and computer. Everything then stays the same on both.</p>${err}<div class="btnrow"><button class="btn" data-a="syncLogin">Sign in with Google</button></div>`;
 const when=y.busy?'Syncing…':y.last?`Last synced ${new Date(y.last).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`:'Waiting to sync';
 return `<p class="small" style="color:var(--ink-2);line-height:1.6">Signed in as <b>${esc(y.user.email)}</b>. ${when}.</p>${err}<div class="btnrow"><button class="btn" data-a="syncNow">Sync now</button><button class="btn ghost" data-a="syncLogout">Sign out</button></div>`;
}

 setInterval(()=>{
  if(S.timer){const c=$('#clock');if(c)c.textContent=elapsed()}
 },1000);

 },30000);
})();
